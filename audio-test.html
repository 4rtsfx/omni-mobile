<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMNI Audio Diagnostics</title><style>body{background:#101923;color:#eef7fb;font:16px -apple-system,system-ui,sans-serif;padding:24px;max-width:500px;margin:auto}h1{letter-spacing:.14em}button{display:block;width:100%;margin:16px 0;padding:20px;border:0;border-radius:14px;background:#65d4c4;color:#09131a;font-size:18px;font-weight:bold}#log{white-space:pre-wrap;background:#1c2d3d;border-radius:12px;padding:16px;line-height:1.6;min-height:130px;word-break:break-word}small{color:#aac2d0}a{color:#6cdbc9}</style></head><body><h1>OMNI / AUDIO TEST</h1><p>Если ты видишь эту страницу — GitHub Pages работает. Проверим звук двумя независимыми способами.</p><button id="web">1 — Проверка Web Audio</button><button id="html">2 — Проверка обычного Audio</button><div id="log">Страница загружена. Нажми кнопку.</div><p><small>Увеличь громкость iPhone. Открывай непосредственно в Safari, не во встроенном просмотрщике ChatGPT.</small></p><p><a href="./">← Вернуться к OMNI</a></p><script>
let ctx=null;const log=s=>{document.getElementById('log').textContent+='\n'+s};log('JavaScript: работает');log('Web Audio поддерживается: '+!!(window.AudioContext||window.webkitAudioContext));log('Адрес: '+location.href);
document.getElementById('web').onclick=async()=>{try{log('Нажата кнопка 1');const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('AudioContext недоступен');ctx=ctx||new C();const o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;o.type='sine';o.frequency.value=523.25;g.gain.value=0.18;o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+1.0);await ctx.resume();log('AudioContext: '+ctx.state+'; частота 523 Hz, 1 сек')}catch(e){log('Ошибка 1: '+e.name+' '+e.message)}};
document.getElementById('html').onclick=async()=>{try{log('Нажата кнопка 2');const sr=16000,n=sr*1,buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);const wr=(at,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(at+i,s.charCodeAt(i))};wr(0,'RIFF');dv.setUint32(4,36+n*2,true);wr(8,'WAVE');wr(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);wr(36,'data');dv.setUint32(40,n*2,true);for(let i=0;i<n;i++){const env=Math.min(1,i/300,(n-i)/2000);dv.setInt16(44+i*2,Math.floor(Math.sin(2*Math.PI*659.25*i/sr)*14000*env),true)}const url=URL.createObjectURL(new Blob([buf],{type:'audio/wav'})),a=new Audio(url);a.onended=()=>{log('Обычный Audio: воспроизведение завершено');URL.revokeObjectURL(url)};await a.play();log('Обычный Audio: play() успешно; частота 659 Hz, 1 сек')}catch(e){log('Ошибка 2: '+e.name+' '+e.message)}};
</script></body></html>
